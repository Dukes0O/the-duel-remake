  - id: TRACK-01
    title: "Generate an honest build status page"
    priority: 1
    lane: TOOL
    size: S
    needs: [FIX-04]
    status: ready
    owns: [tools/build-status.mjs, tools/test-build-status.mjs, docs/board/STATUS.md, docs/board/checks/full-tier.json]
    hooks: [tools/run-tests.mjs]
    helpers: [test_author, test_runner, reviewer]
    spec: "SPEC.md 0.5 and 0.6"
    acceptance:
      - "Read-only inspection writes STATUS.md with live Git commit/build version, integration HEAD, feature switches, lane branches and ages, clean merged worktrees eligible for removal, and local/remote backup state. No live writes, HTTP requests or save access."
      - "Full-tier evidence records commit, time, tier, pass/fail and dirty-source state. A missing, failed, dirty or different-commit result never reports the current exact HEAD as green."
      - "Temporary fixture repositories cover stale and missing evidence, failed full runs, unmerged branches, dirty merged lanes, absent remote and absent build manifest. The tool never removes worktrees or pushes."
      - "Run and commit STATUS.md on integration; subsequent merges and end-of-run refresh it. State its observation commit explicitly so a later metadata commit cannot silently inherit a green check."
