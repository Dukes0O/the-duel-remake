<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Barely News: the TV station on the TV-camera skin (Kyle and Gratian, 14 October 2026).
       A bear's head in studio headphones with a microphone, over the station name.
       Flat colours so it reads as a decal on the helicopter at distance. -->
  <defs>
    <clipPath id="badge"><circle cx="256" cy="226" r="190"/></clipPath>
  </defs>
  <!-- Badge: deep broadcast red ring on charcoal -->
  <circle cx="256" cy="226" r="206" fill="#b3201b"/>
  <circle cx="256" cy="226" r="190" fill="#1d1b1a"/>
  <g clip-path="url(#badge)">
    <!-- On-air light rays behind the bear -->
    <g fill="#2a2725">
      <path d="M256 226 L80 40 L150 20 Z"/><path d="M256 226 L362 20 L432 40 Z"/>
      <path d="M256 226 L470 150 L470 230 Z"/><path d="M256 226 L42 150 L42 230 Z"/>
    </g>
  </g>
  <!-- Ears -->
  <circle cx="160" cy="132" r="44" fill="#5a3a22"/>
  <circle cx="160" cy="132" r="24" fill="#8a5d3b"/>
  <circle cx="352" cy="132" r="44" fill="#5a3a22"/>
  <circle cx="352" cy="132" r="24" fill="#8a5d3b"/>
  <!-- Head -->
  <ellipse cx="256" cy="232" rx="128" ry="118" fill="#6b4529"/>
  <!-- Muzzle -->
  <ellipse cx="256" cy="282" rx="66" ry="52" fill="#c49a6c"/>
  <ellipse cx="256" cy="258" rx="26" ry="18" fill="#1a1110"/>
  <path d="M256 276 L256 296 M256 296 Q240 310 226 302 M256 296 Q272 310 286 302" stroke="#1a1110" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Eyes, a little wry -->
  <circle cx="208" cy="206" r="12" fill="#1a1110"/>
  <circle cx="304" cy="206" r="12" fill="#1a1110"/>
  <circle cx="212" cy="202" r="4" fill="#f4efe6"/>
  <circle cx="308" cy="202" r="4" fill="#f4efe6"/>
  <path d="M190 182 Q208 174 226 182" stroke="#2b1b12" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M286 178 Q304 168 322 176" stroke="#2b1b12" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Headphones: band over the head, cups over the ears' base -->
  <path d="M132 214 Q132 84 256 84 Q380 84 380 214" stroke="#151414" stroke-width="20" fill="none" stroke-linecap="round"/>
  <rect x="106" y="190" width="44" height="76" rx="18" fill="#151414"/>
  <rect x="362" y="190" width="44" height="76" rx="18" fill="#151414"/>
  <rect x="114" y="200" width="28" height="56" rx="12" fill="#b3201b"/>
  <rect x="370" y="200" width="28" height="56" rx="12" fill="#b3201b"/>
  <!-- Boom microphone from the left cup to the mouth -->
  <path d="M136 260 Q150 318 214 314" stroke="#151414" stroke-width="9" fill="none" stroke-linecap="round"/>
  <ellipse cx="222" cy="314" rx="16" ry="12" fill="#3a3735"/>
  <!-- Station name banner -->
  <rect x="56" y="372" width="400" height="70" rx="10" fill="#f4efe6"/>
  <text x="256" y="422" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900"
        font-size="44" letter-spacing="2" fill="#1d1b1a">BARELY NEWS</text>
  <!-- Tagline -->
  <text x="256" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="28" letter-spacing="3" fill="#1d1b1a">JUST THE BEAR FACTS</text>
</svg>
